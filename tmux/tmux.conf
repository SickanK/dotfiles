# Tmux Configuration
# Prefix: C-Space

# Change prefix from C-b to C-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# More history
set -g history-limit 50000

# Faster escape time
set -sg escape-time 0

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Focus events for vim autoread
set -g focus-events on

# ===== Key Bindings =====

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -r n next-window
bind -r p previous-window

# Zoom pane
bind z resize-pane -Z

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# New window in current path
bind c new-window -c "#{pane_current_path}"

# ===== Copy Mode (Vim-style) =====
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ===== Status Bar - Catppuccin Latte =====
set -g status-position top
set -g status-style "bg=#eff1f5,fg=#4c4f69"

# Left side
set -g status-left-length 50
set -g status-left "#[bg=#1e66f5,fg=#eff1f5,bold] #S #[bg=#eff1f5,fg=#1e66f5] "

# Right side
set -g status-right-length 50
set -g status-right "#[fg=#6c6f85] %H:%M #[bg=#1e66f5,fg=#eff1f5,bold] %d-%b "

# Window status
set -g window-status-format "#[fg=#6c6f85] #I:#W "
set -g window-status-current-format "#[bg=#ccd0da,fg=#4c4f69,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#ccd0da"
set -g pane-active-border-style "fg=#1e66f5"

# Message style
set -g message-style "bg=#1e66f5,fg=#eff1f5"

# ===== Plugins (TPM) =====
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'

# Continuum settings (auto-save every 15 min, manual restore)
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
