# Loaded after ~/.config/ghostty/config via macOS Application Support.
# Explicit colors in config take precedence over the theme's colors.
theme = dark:Catppuccin Frappe,light:Xcode Light
macos-titlebar-style = tabs
window-save-state = always
window-vsync = true
window-colorspace = display-p3
quick-terminal-screen = macos-menu-bar
